name: check
on: [push, pull_request]
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in install.sh apply-my-dots.sh uninstall.sh install-scripts/*.sh my-dots/config/hypr/scripts/*.sh my-dots/config/hypr/initial-boot.sh; do
            [ "$(basename "$f")" = RofiEmoji.sh ] && continue   # data after the script body
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
          done
      - name: Dry run
        run: ./apply-my-dots.sh --dry-run
