# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this


# ---- gaming: let a fullscreen game bypass the compositor -----------------
# Hyprland was measured at ~17% CPU while Deadlock ran. Direct scanout hands
# the game's buffer straight to the display plane, so the compositor stops
# doing a per-frame composite pass for a fullscreen window.
render {
    direct_scanout = 1
}

# Required for the `immediate` window rule (tearing) to take effect. Lets a
# game present without waiting on the 60 Hz vblank -- matters most when you
# are BELOW refresh, which Deadlock is.
general {
    allow_tearing = true
}
