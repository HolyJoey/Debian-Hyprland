# For window rules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


# Layer rules now belong in UserConfigs/LayerRules.conf

# ---- Rofi: blurvlek + verspringende menugrootte ----------------------------
# Debian levert rofi 1.7.5 zonder Wayland-backend, dus rofi draait via XWayland
# als gewoon venster (de "match:namespace rofi" layerrules matchen daarom nooit).
#
# configs/WindowRules.conf tagt rofi als +settings, en de "Settings (tag)" regel
# propte elk rofi-venster in (monitor_w*0.7) x (monitor_h*0.7). Rofi wil zijn
# eigen maat (de launcher b.v. 25% breed) en bleef daartegen aan vechten: de
# getekende box sprong heen en weer tussen de eigen hoogte en de opgelegde 840px.
# Het onbeschilderde restant van dat te grote venster was transparant, en juist
# daar legde Hyprland blur op -- de blurrechthoek onder het menu.
#
# tag -settings haalt die opgelegde maat weg zodat rofi zichzelf opmeet;
# float/center houden we wel, want die kwamen uit dezelfde tag.
windowrule = match:class ^([Rr]ofi)$, tag -settings
windowrule = match:class ^([Rr]ofi)$, float on
windowrule = match:class ^([Rr]ofi)$, center on

# no_blur tegen restblur op transparante randen; opacity 1.0 hoort erbij, want
# zonder blur zou je door de 0.8-transparantie heen scherp de vensters eronder lezen.
windowrule = match:class ^([Rr]ofi)$, no_blur on
windowrule = match:class ^([Rr]ofi)$, opacity 1.0


# Deadlock (Proton, appid 1422450): allow tearing / immediate presentation.
windowrule = match:class ^([Ss]team_app_1422450)$, immediate on
windowrule = match:class ^([Dd]eadlock)$, immediate on

# Boosteroid cloud-gaming client: immediate (tearing) presentation. Lets a newly
# decoded frame reach the panel without waiting for the next vblank, removing up
# to one 60 Hz frame (~16.7 ms) of added latency. Needs general:allow_tearing,
# already on in UserSettings.conf.
windowrule = match:class ^([Bb]oosteroid)$, immediate on
