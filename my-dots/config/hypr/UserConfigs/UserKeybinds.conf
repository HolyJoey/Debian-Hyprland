# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

##############
#  Rebinds   #
##############

# configs/Keybinds.conf uses xdg-open, which follows the system default browser (chromium).
unbind = $mainMod, B
bindd = $mainMod, B, Open Firefox, exec, firefox-esr


##############
#  unbinds   #
##############




# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# /* ---- 🖥️ Per-monitor workspace blocks ---- */  #
# Every monitor owns 5 workspaces (laptop 1-5, next monitor 6-10, 11-15, ...).
# SUPER + 1..5 therefore has to be relative to whichever monitor has focus.
# See ~/.config/hypr/scripts/MonitorWorkspaces.sh
$mws = $HOME/.config/hypr/scripts/MonitorWorkspaces.sh

unbind = $mainMod, code:10
unbind = $mainMod, code:11
unbind = $mainMod, code:12
unbind = $mainMod, code:13
unbind = $mainMod, code:14
bindd = $mainMod, code:10, Workspace 1 of this monitor, exec, $mws switch 1
bindd = $mainMod, code:11, Workspace 2 of this monitor, exec, $mws switch 2
bindd = $mainMod, code:12, Workspace 3 of this monitor, exec, $mws switch 3
bindd = $mainMod, code:13, Workspace 4 of this monitor, exec, $mws switch 4
bindd = $mainMod, code:14, Workspace 5 of this monitor, exec, $mws switch 5

unbind = $mainMod SHIFT, code:10
unbind = $mainMod SHIFT, code:11
unbind = $mainMod SHIFT, code:12
unbind = $mainMod SHIFT, code:13
unbind = $mainMod SHIFT, code:14
bindd = $mainMod SHIFT, code:10, Move to workspace 1 of this monitor, exec, $mws move 1
bindd = $mainMod SHIFT, code:11, Move to workspace 2 of this monitor, exec, $mws move 2
bindd = $mainMod SHIFT, code:12, Move to workspace 3 of this monitor, exec, $mws move 3
bindd = $mainMod SHIFT, code:13, Move to workspace 4 of this monitor, exec, $mws move 4
bindd = $mainMod SHIFT, code:14, Move to workspace 5 of this monitor, exec, $mws move 5

unbind = $mainMod CTRL, code:10
unbind = $mainMod CTRL, code:11
unbind = $mainMod CTRL, code:12
unbind = $mainMod CTRL, code:13
unbind = $mainMod CTRL, code:14
bindd = $mainMod CTRL, code:10, Move silently to workspace 1 of this monitor, exec, $mws movesilent 1
bindd = $mainMod CTRL, code:11, Move silently to workspace 2 of this monitor, exec, $mws movesilent 2
bindd = $mainMod CTRL, code:12, Move silently to workspace 3 of this monitor, exec, $mws movesilent 3
bindd = $mainMod CTRL, code:13, Move silently to workspace 4 of this monitor, exec, $mws movesilent 4
bindd = $mainMod CTRL, code:14, Move silently to workspace 5 of this monitor, exec, $mws movesilent 5

# /* ---- 🔒 Lock screen ---- */  #
# configs/Keybinds.conf ships CTRL ALT, L. Add SUPER, L as well (muscle memory).
bindd = $mainMod, L, Lock screen, exec, $scriptsDir/LockScreen.sh
