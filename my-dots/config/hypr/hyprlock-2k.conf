# USER
label {
    monitor =
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.0
    text =   $USER
    color = $color9
    font_size = 48
    font_family = Victor Mono Bold Oblique
    position = 0, 300
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 306, 93
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    # Light border and near-white text like the labels. No shadow and only a
    # faint fill: a shadow under a see-through fill pulsed on every redraw.
    outer_color = $color7
    inner_color = rgba(255, 255, 255, 0.1)
	capslock_color = rgb(255,255,255)
    font_color = $foreground
    fade_on_empty = false
    font_family = Victor Mono Bold Oblique
    placeholder_text = <i><span foreground="##ffffff99">🔒 Type Password</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT
label {
    monitor =
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.0
    text = $LAYOUT
    color = $color7
    font_size = 19
    font_family = Victor Mono Bold Oblique
    position = 0, 53
    halign = center
    valign = bottom
}

# uptime
label {
    monitor =
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.0
    text = cmd[update:60000] echo "<b> "$(uptime -p || $Scripts/UptimeNixOS.sh)" </b>"
    color = $color7
    font_size = 32
    font_family = Victor Mono Bold Oblique
    position = 0, 0
    halign = right
    valign = bottom
}

# battery information
label {
    monitor =
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.0
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = $color7
    font_size = 21
    font_family = Victor Mono Bold Oblique
    position = 0, 40
    halign = right
    valign = bottom
}

# weather edit the scripts for locations
# weather scripts are located in ~/.config/hypr/UserScripts Weather.sh and/or Weather.py
# see https://github.com/LinuxBeginnings/Hyprland-Dots/wiki/TIPS#%EF%B8%8F-weather-app-related-for-waybar-and-hyprlock
label {
    monitor =
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.0
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat  "$HOME/.cache/.weather_cache"
    color = $color7
    font_size = 19
    font_family = Victor Mono Bold Oblique
    position = 50, 0
    halign = left
    valign = bottom
}
