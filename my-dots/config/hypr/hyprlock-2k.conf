# Hyprlock config for => 2k monitor resolutions                                                         
# Original config submitted by https://github.com/SherLock707

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    fractional_scaling = 2
    immediate_render = false
}

background {
    monitor =
    # NOTE: use only 1 path
	#path = screenshot   # screenshot of your desktop
	#path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_modified # by wallpaper effects
    path = @HOME@/.config/hypr/wallpaper_effects/.hyprlock_current
    
    color = rgb(0,0,0) # color will be rendered initially until path is available

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 5
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.1000
    # Dimmed so light text stays readable on any wallpaper (the lock screen
    # follows the wallpaper; its colours come from wallust)
    brightness = 0.5500
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# Date
label {
    monitor =
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.0
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = $color13
    font_size = 64
    font_family = Victor Mono Bold Italic
    position = 0, -20
    halign = center
    valign = center
}

# Hour-Time (single horizontal time like 1080p variant)
label {
    monitor =
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.0
#     text = cmd[update:1000] echo "$(date +"%H:%M")"   # 24h option
    # 12h/24h follows the Waybar clock setting (scripts/LockClock.sh)
    text = cmd[update:1000] $HOME/.config/hypr/scripts/LockClock.sh
	#color = rgba(255, 185, 0, .8)
    color = $foreground
    font_size = 173
    font_family = JetBrainsMono Nerd Font ExtraBold 
    position = 0, -133
    halign = center
    valign = top
}

